name: orca

services:
  app:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: orca-app:local
    container_name: orca-app
    init: true
    restart: "no"
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-5000}:5000"
    environment:
      BIND: "0.0.0.0:5000"
      BUDGET_DB_PATH: /app/data/orcamento.db
      BUDGET_EXPORT_DIR: /app/exports
      BUDGET_SOURCE_FILE: "/app/data/gastos mensais.ods"
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: America/Sao_Paulo
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./exports
        target: /app/exports
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
