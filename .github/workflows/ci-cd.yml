name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orcamento-production
  cancel-in-progress: false

jobs:
  validate:
    name: Testar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias Python
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Executar testes
        run: pytest

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Publicar no servidor
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - x64
      - orcamento-production
    timeout-minutes: 20
    environment: production
    steps:
      - name: Baixar codigo validado
        uses: actions/checkout@v4

      - name: Atualizar aplicacao
        run: scripts/deploy.sh "$GITHUB_WORKSPACE" "$HOME/apps/orcamento"
